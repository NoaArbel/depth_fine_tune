data:
  raw_dir: data/raw
  processed_dir: data/processed
  split_csv: data/split.csv
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  image_size: 518  # Depth Anything V2 ViT-S default

model:
  name: depth-anything/Depth-Anything-V2-Small-hf
  backbone: vit_small_patch14_518

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["query", "value"]
  lora_dropout: 0.05
  bias: none

training:
  epochs: 5
  batch_size: 2
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  save_every: 5
  checkpoint_dir: checkpoints/

inference:
  output_dir: results/
